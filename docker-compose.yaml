services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon_pass
      POSTGRES_DB: recon_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon_db"]
      interval: 5s
      retries: 5

  airflow-metadata-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
      - ./reports:/opt/airflow/reports
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /requirements.txt"
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db init && airflow users create --username admin --password admin --firstname Mark --lastname Shloss --role Admin --email admin@example.com
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./requirements.txt:/requirements.txt
      - ./data:/opt/airflow/data
      - ./.env.airflow:/opt/airflow/.env
      - ./reports:/opt/airflow/reports

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /requirements.txt"
      AIRFLOW__WEBSERVER__SECRET_KEY: "any-fixed-random-string-just-make-it-the-same-everywhere"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./.env:/opt/airflow/.env
      - ./requirements.txt:/requirements.txt
      - ./data:/opt/airflow/data
      - ./.env.airflow:/opt/airflow/.env
      - ./reports:/opt/airflow/reports
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /requirements.txt"
      AIRFLOW__WEBSERVER__SECRET_KEY: "any-fixed-random-string-just-make-it-the-same-everywhere"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./.env:/opt/airflow/.env
      - ./requirements.txt:/requirements.txt
      - ./data:/opt/airflow/data
      - ./.env.airflow:/opt/airflow/.env
      - ./reports:/opt/airflow/reports
    command: scheduler

volumes:
  pgdata:
  airflow_metadata:
